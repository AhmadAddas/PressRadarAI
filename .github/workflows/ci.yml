name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: fake
      EMAIL_PROVIDER: fake
      PITCH_SENDER: simulated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build validation images
        run: docker compose build api api-tools web-tools mailer mailer-tools
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Unit and integration tests with coverage
        run: make test
      - name: Production build
        run: make build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate Terraform
        run: make infra-validate
      - name: Audit dependencies and production images
        run: make security
      - name: Install browser smoke dependencies
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start production web for browser smoke tests
        run: docker compose up -d --no-deps web
      - name: Browser and accessibility smoke tests
        working-directory: apps/web
        run: npm run test:e2e
