[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pressradar-api"
version = "0.1.0"
description = "PressRadar API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
  "fastapi>=0.116,<1",
  "google-cloud-bigquery>=3.35,<4",
  "google-cloud-firestore>=2.21,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=pressradar --cov-branch --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
