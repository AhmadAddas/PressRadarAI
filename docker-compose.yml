services:
  api:
    init: true
    build:
      context: ./apps/api
      target: production
    environment: &api-environment
      APP_MODE: ${APP_MODE:-local}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_PATH: /data/pressradar.db
      OPERATIONAL_PROVIDER: ${OPERATIONAL_PROVIDER:-sqlite}
      ANALYTICS_DATABASE_PATH: /data/analytics.db
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      PITCH_SENDER: ${PITCH_SENDER:-simulated}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-fake}
      MAILER_BASE_URL: ${MAILER_BASE_URL:-http://mailer:3001}
      MAILER_INTERNAL_TOKEN: ${MAILER_INTERNAL_TOKEN:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-fake}
      CRM_PROVIDER: ${CRM_PROVIDER:-fake}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-sqlite}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-(default)}
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-pressradar_analytics}
      BIGQUERY_EVENTS_TABLE: ${BIGQUERY_EVENTS_TABLE:-product_events}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      EXTERNAL_PROVIDER_TIMEOUT_SECONDS: ${EXTERNAL_PROVIDER_TIMEOUT_SECONDS:-10}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      LOCAL_AI_ADMIN_EMAILS: ${LOCAL_AI_ADMIN_EMAILS:-}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-10}
      EMAIL_RATE_LIMIT_REQUESTS: ${EMAIL_RATE_LIMIT_REQUESTS:-3}
      TRANSLATION_RATE_LIMIT_REQUESTS: ${TRANSLATION_RATE_LIMIT_REQUESTS:-10}
    depends_on:
      api-data-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      ollama-translator:
        condition: service_completed_successfully
      mailer:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  api-data-init:
    build:
      context: ./apps/api
      target: production
    user: root
    command: ["chown", "-R", "pressradar:pressradar", "/data"]
    volumes:
      - api-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"

  api-tools:
    profiles: ["tools"]
    build:
      context: ./apps/api
      target: development
    environment: *api-environment
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - api-data:/data

  ollama:
    image: ollama/ollama:0.32.15
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-models:
    image: ollama/ollama:0.32.15
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ollama-translator:
    image: ollama/ollama:0.32.15
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}"]
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    restart: "no"

  web:
    init: true
    build:
      context: ./apps/web
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  web-tools:
    profiles: ["tools"]
    build:
      context: ./apps/web
      target: development
    volumes:
      - ./apps/web/src:/app/src

  mailer:
    init: true
    build:
      context: ./apps/mailer
      target: production
    environment:
      PORT: 3001
      MAILER_INTERNAL_TOKEN: ${MAILER_INTERNAL_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailer-tools:
    profiles: ["tools"]
    build:
      context: ./apps/mailer
      target: development

volumes:
  api-data:
  ollama-data:
