services:
  api:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_MODE: ${APP_MODE:-local}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_PATH: /data/pressradar.db
      OPERATIONAL_PROVIDER: ${OPERATIONAL_PROVIDER:-sqlite}
      ANALYTICS_DATABASE_PATH: /data/analytics.db
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      PITCH_SENDER: ${PITCH_SENDER:-simulated}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-fake}
      CRM_PROVIDER: ${CRM_PROVIDER:-fake}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-sqlite}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-(default)}
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-pressradar_analytics}
      BIGQUERY_EVENTS_TABLE: ${BIGQUERY_EVENTS_TABLE:-product_events}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER: ${TWILIO_TO_NUMBER:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
      EXTERNAL_PROVIDER_TIMEOUT_SECONDS: ${EXTERNAL_PROVIDER_TIMEOUT_SECONDS:-10}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      ollama-translator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - api-data:/data

  ollama:
    image: ollama/ollama:0.32.15
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-models:
    image: ollama/ollama:0.32.15
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ollama-translator:
    image: ollama/ollama:0.32.15
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}"]
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: ./apps/web
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  web-tools:
    profiles: ["tools"]
    build:
      context: ./apps/web
      target: development
    volumes:
      - ./apps/web/src:/app/src

volumes:
  api-data:
  ollama-data:
