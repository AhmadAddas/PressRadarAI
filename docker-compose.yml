services:
  api:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_MODE: ${APP_MODE:-local}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_PATH: /data/pressradar.db
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      PITCH_SENDER: ${PITCH_SENDER:-simulated}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-fake}
      CRM_PROVIDER: ${CRM_PROVIDER:-fake}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER: ${TWILIO_TO_NUMBER:-}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      EXTERNAL_PROVIDER_TIMEOUT_SECONDS: ${EXTERNAL_PROVIDER_TIMEOUT_SECONDS:-10}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - api-data:/data

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      api:
        condition: service_started

volumes:
  api-data:
